<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RR Live">
<meta name="theme-color" content="#1B1D22">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Roster Regret — live queue</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#1B1D22;color:#F2EEE6;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:620px;margin:0 auto;padding:16px 14px 72px}
  h1{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#C8A24A;margin:0 0 3px}
  .sub{color:#8A8578;font-size:12.5px;margin:0 0 22px}
  .batch{margin:0 0 34px;border-top:1px solid #2C3037;padding-top:16px}
  .bh .t{font-size:11px;letter-spacing:.14em;color:#8A8578;font-weight:700}
  .bh h2{font-size:19px;line-height:1.3;margin:5px 0 16px;font-weight:600}
  .opt{background:#1E2128;border:1px solid #2F343C;border-radius:12px;
    padding:12px;margin:0 0 16px}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ltr{background:#C8A24A;color:#1B1D22;font-weight:800;font-size:15px;
    width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
  .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A8578;font-weight:700}
  .opt img{width:100%;height:auto;display:block;border-radius:7px;background:#F2EEE6}
  .cap{font-size:16px;line-height:1.4;margin:12px 2px 0}
  .note{font-size:12.5px;color:#8A8578;margin:7px 2px 0;font-style:italic}
  .btns{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  .btn{flex:1 1 auto;text-align:center;background:#2A2E36;color:#F2EEE6;border:1px solid #3B414B;
    border-radius:8px;padding:12px 10px;font:inherit;font-size:14px;font-weight:600;
    text-decoration:none;cursor:pointer;min-width:104px}
  .btn.primary{background:#C8A24A;border-color:#C8A24A;color:#1B1D22;font-weight:800}
  .btn.done{background:#D4553A;border-color:#D4553A;color:#F2EEE6}
  .reply{font-size:12.5px;color:#8A8578;margin:2px 2px 0}
  .reply b{color:#F2EEE6}
  .empty{color:#8A8578;font-size:14px;padding:30px 0;border-top:1px solid #2C3037}
</style>
</head>
<body>
<div class="wrap">
  <h1>Roster Regret — live queue</h1>
  <p class="sub">DRILL 1 — HOF Game, Cardinals v Panthers · cleared 6 Aug 2026, 18:41 MT
     · 0 batches</p>

  <div class="empty">
    Queue is empty. Fire an observation in the thread and the first batch lands here.
    Batch numbering restarts at <b>b1</b>.
  </div>
</div>
<script>
function copyCap(id, btn){
  var t = document.getElementById(id).innerText;
  navigator.clipboard.writeText(t).then(function(){
    var o = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent = o; btn.classList.remove('done'); }, 1400);
  });
}
</script>
</body>
</html>
